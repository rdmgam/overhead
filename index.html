<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Overhead</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Overhead">
<meta name="theme-color" content="#061410">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --scope-bg: #061410;
    --scope-ring: #153a2c;
    --scope-ring-dim: #0e2a20;
    --amber: #ffb347;
    --amber-dim: #a67232;
    --mint: #6fd9a8;
    --ink: #dff2ea;
    --ink-dim: #7fa596;
    --panel-bg: #08120f;
    --panel-line: #16302a;
    --danger: #ff6b5e;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #020806;
    color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
  }

  .app {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    gap: 18px;
    max-width: 1100px;
    margin: 0 auto;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    border-bottom: 1px solid var(--panel-line);
    padding-bottom: 14px;
  }

  header h1 {
    font-size: 1.6rem;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.01em;
  }

  .status-line {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    color: var(--ink-dim);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--mint);
    box-shadow: 0 0 6px var(--mint);
  }
  .status-dot.stale { background: var(--danger); box-shadow: 0 0 6px var(--danger); animation: none; }
  .status-dot.live { animation: pulse 2s ease-in-out infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .location-line {
    font-size: 0.9rem;
    color: var(--ink-dim);
  }

  .location-line button {
    background: none;
    border: none;
    color: var(--amber);
    font-family: inherit;
    font-size: inherit;
    cursor: pointer;
    padding: 0;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  main {
    display: grid;
    grid-template-columns: minmax(280px, 440px) 1fr;
    gap: 22px;
    flex: 1;
  }

  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; }
  }

  /* ---------- Scope ---------- */

  .scope-frame {
    position: relative;
    aspect-ratio: 1;
    width: 100%;
    border-radius: 50%;
    background: var(--scope-bg);
    border: 1px solid var(--panel-line);
    overflow: hidden;
    box-shadow: inset 0 0 60px rgba(0,0,0,0.6);
  }

  .sweep {
    position: absolute;
    inset: 0;
    background: conic-gradient(
      from 0deg,
      rgba(111, 217, 168, 0.22) 0deg,
      rgba(111, 217, 168, 0.05) 25deg,
      transparent 70deg
    );
    animation: rotate 8s linear infinite;
    transform-origin: center;
  }

  @keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .scope-frame svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .ring { fill: none; stroke: var(--scope-ring); stroke-width: 1; }
  .ring-dim { fill: none; stroke: var(--scope-ring-dim); stroke-width: 1; stroke-dasharray: 2 4; }
  .crosshair { stroke: var(--scope-ring); stroke-width: 1; }
  .compass-label {
    fill: var(--ink-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
  }
  .range-label {
    fill: var(--ink-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
  }

  .blip {
    cursor: pointer;
  }
  .blip .tri {
    fill: var(--amber);
    stroke: none;
  }
  .blip.selected .tri {
    fill: var(--ink);
  }
  .blip-halo {
    fill: none;
    stroke: var(--amber);
    stroke-width: 1;
    opacity: 0.35;
  }
  .blip-label {
    fill: var(--amber-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
  }
  .blip.selected .blip-label { fill: var(--ink); }

  .center-dot {
    fill: var(--mint);
  }

  /* ---------- Data panel ---------- */

  .panel {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .panel-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }

  .panel-head h2 {
    font-size: 0.95rem;
    font-weight: 500;
    margin: 0;
    color: var(--ink-dim);
  }

  .panel-head .count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    color: var(--ink-dim);
  }

  .flight-list {
    list-style: none;
    margin: 0;
    padding: 0;
    overflow-y: auto;
    border-top: 1px solid var(--panel-line);
  }

  .flight-row {
    display: grid;
    grid-template-columns: 1fr auto auto auto auto;
    gap: 14px;
    align-items: center;
    padding: 10px 6px;
    border-bottom: 1px solid var(--panel-line);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .flight-row:hover, .flight-row.selected {
    background: rgba(255, 179, 71, 0.08);
  }

  .flight-row .callsign {
    color: var(--ink);
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  .flight-row .country {
    color: var(--ink-dim);
    font-size: 0.7rem;
    font-family: 'Space Grotesk', sans-serif;
    grid-column: 1;
    grid-row: 2;
    margin-top: -6px;
  }

  .flight-row .metric { color: var(--ink-dim); text-align: right; white-space: nowrap; }
  .flight-row .metric .val { color: var(--ink); }

  .vrate-up { color: var(--mint); }
  .vrate-down { color: var(--danger); }

  .empty-state, .error-state {
    padding: 30px 10px;
    text-align: center;
    color: var(--ink-dim);
    font-size: 0.9rem;
    line-height: 1.5;
  }

  .error-state { color: var(--danger); }

  .flight-expansion {
    padding: 12px 10px 14px;
    border-bottom: 1px solid var(--panel-line);
    background: rgba(255, 179, 71, 0.04);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
  }
  .flight-expansion .row { display: flex; justify-content: space-between; padding: 3px 0; }
  .flight-expansion .row span:first-child { color: var(--ink-dim); }
  .flight-expansion .detail-divider { border-top: 1px solid var(--panel-line); margin: 10px 0; }

  footer {
    font-size: 0.75rem;
    color: var(--ink-dim);
    text-align: center;
    padding-top: 8px;
  }

  footer a { color: var(--ink-dim); }

  .loc-form {
    display: none;
    gap: 8px;
    align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
  }
  .loc-form.visible { display: flex; flex-wrap: wrap; }
  .loc-form input {
    background: var(--panel-bg);
    border: 1px solid var(--panel-line);
    color: var(--ink);
    font-family: inherit;
    font-size: inherit;
    padding: 4px 8px;
    width: 100px;
    border-radius: 3px;
  }
  .loc-form button {
    background: var(--amber-dim);
    border: none;
    color: #10160f;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 0.8rem;
    padding: 5px 12px;
    border-radius: 3px;
    cursor: pointer;
  }

  .range-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    color: var(--ink-dim);
  }

  .range-label-text {
    color: var(--ink-dim);
  }

  .range-row button {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid var(--panel-line);
    background: var(--panel-bg);
    color: var(--amber);
    font-family: 'JetBrains Mono', monospace;
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .range-row button:active {
    background: rgba(255, 179, 71, 0.15);
  }

  #rangeValueText {
    color: var(--ink);
    min-width: 48px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div>
      <h1>Overhead</h1>
      <div class="location-line" id="locationLine">
        Locating you… <button id="editLocationBtn" style="display:none;">change</button>
      </div>
    </div>
    <div class="status-line">
      <span class="status-dot live" id="statusDot"></span>
      <span id="statusText">connecting</span>
    </div>
  </header>

  <div class="loc-form" id="locForm">
    <input type="text" id="latInput" placeholder="latitude">
    <input type="text" id="lonInput" placeholder="longitude">
    <button id="applyLocBtn">Use this location</button>
  </div>

  <div class="range-row">
    <span class="range-label-text">Range</span>
    <button id="rangeDownBtn" aria-label="Decrease range">−</button>
    <span id="rangeValueText">40 nm</span>
    <button id="rangeUpBtn" aria-label="Increase range">+</button>
  </div>

  <main>
    <div class="scope-frame" id="scopeFrame">
      <div class="sweep"></div>
      <svg id="scopeSvg" viewBox="0 0 400 400"></svg>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Tracked aircraft, nearest first</h2>
        <span class="count" id="flightCount">—</span>
      </div>
      <ul class="flight-list" id="flightList">
        <li class="empty-state">Waiting for a location fix…</li>
      </ul>
    </div>
  </main>

  <footer>
    Live positions from <a href="https://opensky-network.org" target="_blank" rel="noopener">OpenSky Network</a>,
    a volunteer ADS-B receiver community. Some aircraft (military, some GA) may not broadcast and won't appear.
  </footer>

</div>

<script>
(function () {
  let RANGE_NM = 40; // scope radius in nautical miles — adjustable via +/- controls
  const RANGE_MIN = 10;
  const RANGE_MAX = 150;
  const RANGE_STEP = 10;
  const REFRESH_MS = 45000; // stay well under OpenSky's anonymous daily credit quota
  const STALE_MS = 90000;
  const OWN_PROXY = 'https://overheadproxy.mgambrell.workers.dev/?url=';

  let center = null; // {lat, lon, label}
  let flights = [];
  let selectedIcao = null;
  let refreshTimer = null;
  const aircraftInfoCache = new Map(); // icao24 -> { state: 'loading'|'ready'|'none'|'error', data?, message? }

  const svg = document.getElementById('scopeSvg');
  const flightList = document.getElementById('flightList');
  const flightCount = document.getElementById('flightCount');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const locationLine = document.getElementById('locationLine');
  const editBtn = document.getElementById('editLocationBtn');
  const locForm = document.getElementById('locForm');

  function toRad(d) { return d * Math.PI / 180; }
  function toDeg(r) { return r * 180 / Math.PI; }

  function haversineNm(lat1, lon1, lat2, lon2) {
    const R = 3440.065; // nm
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
    return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function bearingDeg(lat1, lon1, lat2, lon2) {
    const y = Math.sin(toRad(lon2 - lon1)) * Math.cos(toRad(lat2));
    const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
              Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(toRad(lon2 - lon1));
    return (toDeg(Math.atan2(y, x)) + 360) % 360;
  }

  // Rough bounding box (deg) for a given radius in nm around a point.
  function bboxFor(lat, lon, nm) {
    const latDelta = nm / 60; // ~60 nm per degree latitude
    const lonDelta = nm / (60 * Math.cos(toRad(lat)) || 1);
    return {
      lamin: lat - latDelta, lamax: lat + latDelta,
      lomin: lon - lonDelta, lomax: lon + lonDelta
    };
  }

  function setStatus(text, state) {
    statusText.textContent = text;
    statusDot.className = 'status-dot ' + (state || 'live');
  }

  function setLocationLabel(label) {
    locationLine.innerHTML = label + ' <button id="editLocationBtn">change</button>';
    document.getElementById('editLocationBtn').addEventListener('click', showLocForm);
  }

  function showLocForm() {
    locForm.classList.add('visible');
    if (center) {
      document.getElementById('latInput').value = center.lat.toFixed(4);
      document.getElementById('lonInput').value = center.lon.toFixed(4);
    }
  }

  document.getElementById('applyLocBtn').addEventListener('click', function () {
    const lat = parseFloat(document.getElementById('latInput').value);
    const lon = parseFloat(document.getElementById('lonInput').value);
    if (isNaN(lat) || isNaN(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) {
      alert('Enter a valid latitude (-90 to 90) and longitude (-180 to 180).');
      return;
    }
    locForm.classList.remove('visible');
    setCenter(lat, lon, lat.toFixed(3) + ', ' + lon.toFixed(3));
  });

  function setCenter(lat, lon, label) {
    center = { lat, lon, label };
    setLocationLabel('Within ' + RANGE_NM + ' nautical miles of ' + label);
    drawScopeBase();
    fetchFlights();
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(fetchFlights, REFRESH_MS);
  }

  function applyRangeChange(newRange) {
    RANGE_NM = Math.max(RANGE_MIN, Math.min(RANGE_MAX, newRange));
    document.getElementById('rangeValueText').textContent = RANGE_NM + ' nm';
    if (center) {
      setLocationLabel('Within ' + RANGE_NM + ' nautical miles of ' + center.label);
      drawScopeBase();
      fetchFlights(); // re-fetch immediately against the new radius rather than waiting for the next tick
    } else {
      drawScopeBase();
    }
  }

  document.getElementById('rangeDownBtn').addEventListener('click', function () {
    applyRangeChange(RANGE_NM - RANGE_STEP);
  });
  document.getElementById('rangeUpBtn').addEventListener('click', function () {
    applyRangeChange(RANGE_NM + RANGE_STEP);
  });

  function drawScopeBase() {
    const rings = [0.33, 0.66, 1.0]; // fraction of RANGE_NM at r=180
    const cx = 200, cy = 200, maxR = 180;
    let parts = '';
    rings.forEach(function (f) {
      parts += '<circle class="ring' + (f === 1 ? '' : ' ring-dim') + '" cx="' + cx + '" cy="' + cy + '" r="' + (maxR * f) + '"/>';
      parts += '<text class="range-label" x="' + (cx + 4) + '" y="' + (cy - maxR * f + 10) + '">' + Math.round(RANGE_NM * f) + ' nm</text>';
    });
    parts += '<line class="crosshair" x1="' + cx + '" y1="20" x2="' + cx + '" y2="380"/>';
    parts += '<line class="crosshair" x1="20" y1="' + cy + '" x2="380" y2="' + cy + '"/>';
    parts += '<text class="compass-label" x="' + cx + '" y="14" text-anchor="middle">N</text>';
    parts += '<text class="compass-label" x="' + cx + '" y="394" text-anchor="middle">S</text>';
    parts += '<text class="compass-label" x="8" y="' + (cy + 4) + '">W</text>';
    parts += '<text class="compass-label" x="392" y="' + (cy + 4) + '" text-anchor="end">E</text>';
    parts += '<circle class="center-dot" cx="' + cx + '" cy="' + cy + '" r="3"/>';
    svg.innerHTML = parts;
  }

  function classifyOpenSkySample(s) {
    return {
      icao24: s[0],
      callsign: (s[1] || '').trim() || null,
      country: s[2],
      lon: s[5],
      lat: s[6],
      baroAltM: s[7],
      onGround: s[8],
      velocityMs: s[9],
      trueTrack: s[10],
      vrateMs: s[11],
    };
  }

  function classifyAdsbLolAircraft(a) {
    const onGround = a.alt_baro === 'ground';
    const altFt = (typeof a.alt_baro === 'number') ? a.alt_baro : null;
    return {
      icao24: (a.hex || '').toLowerCase(),
      callsign: (a.flight || '').trim() || null,
      country: a.r || a.t || '', // adsb.lol doesn't give origin country — show registration/type instead
      lat: (typeof a.lat === 'number') ? a.lat : null,
      lon: (typeof a.lon === 'number') ? a.lon : null,
      baroAltM: altFt != null ? altFt / 3.28084 : null,
      onGround: onGround,
      velocityMs: (typeof a.gs === 'number') ? a.gs / 1.94384 : null,
      trueTrack: (typeof a.track === 'number') ? a.track : null,
      vrateMs: (typeof a.baro_rate === 'number') ? a.baro_rate / 196.85 : null,
    };
  }

  // Each source returns a raw (unfiltered, undistanced) array of normalized
  // aircraft objects, or throws. Tried in order; first success wins.
  // adsb.lol and airplanes.live are independently-run community networks
  // that happen to share the same free, keyless, ADSBExchange-v2-compatible
  // API shape — one function covers both.
  async function fetchViaAdsbExchangeCompatible(host, c, proxyPrefix) {
    const direct = 'https://' + host + '/v2/point/' + c.lat + '/' + c.lon + '/' + RANGE_NM;
    const url = proxyPrefix ? proxyPrefix + encodeURIComponent(direct) : direct;
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    return (data.ac || []).map(classifyAdsbLolAircraft);
  }

  async function fetchViaOpenSky(c, proxyPrefix) {
    const box = bboxFor(c.lat, c.lon, RANGE_NM);
    const direct = 'https://opensky-network.org/api/states/all?lamin=' + box.lamin +
                   '&lomin=' + box.lomin + '&lamax=' + box.lamax + '&lomax=' + box.lomax;
    const url = proxyPrefix ? proxyPrefix + encodeURIComponent(direct) : direct;
    const res = await fetch(url);
    if (res.status === 429) throw Object.assign(new Error('rate limited'), { status: 429 });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const data = JSON.parse(text); // throws its own error on an HTML error page from a proxy
    return (data.states || []).map(classifyOpenSkySample);
  }

  // Owner + registration + flight route lookup, from adsbdb.com — a free,
  // keyless community database. Returns the parsed "response" object, or
  // null for a confirmed "not in the database" (their real 404 case).
  async function fetchAdsbdbInfo(icao24, callsign) {
    const path = '/v0/aircraft/' + icao24 + (callsign ? ('?callsign=' + encodeURIComponent(callsign)) : '');
    const direct = 'https://api.adsbdb.com' + path;
    try {
      const res = await fetch(direct);
      if (res.status === 404) return null;
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return (await res.json()).response;
    } catch (directErr) {
      const proxied = OWN_PROXY + encodeURIComponent(direct);
      const res = await fetch(proxied);
      if (res.status === 404) return null;
      if (!res.ok) throw new Error('HTTP ' + res.status + ' (via proxy)');
      return (await res.json()).response;
    }
  }

  // Fire-and-cache: only ever looks a given aircraft up once per session.
  // Re-renders the flight list in place once the lookup resolves — this
  // updates both the row (registration/owner) and, if it's the expanded
  // one, the inline detail dropdown.
  function requestAircraftInfo(icao24, callsign) {
    if (aircraftInfoCache.has(icao24)) return;
    aircraftInfoCache.set(icao24, { state: 'loading' });
    fetchAdsbdbInfo(icao24, callsign).then(function (resp) {
      aircraftInfoCache.set(icao24, resp ? { state: 'ready', data: resp } : { state: 'none' });
      if (flights.some(function (f) { return f.icao24 === icao24; })) renderFlights();
    }).catch(function (err) {
      aircraftInfoCache.set(icao24, { state: 'error', message: err && err.message });
      if (flights.some(function (f) { return f.icao24 === icao24; })) renderFlights();
    });
  }

  function renderAircraftInfoSection(icao24) {
    const entry = aircraftInfoCache.get(icao24);
    if (!entry || entry.state === 'loading') {
      return '<div class="row" style="opacity:0.6;"><span>Owner &amp; route</span><span>looking up…</span></div>';
    }
    if (entry.state === 'error') {
      return '<div class="row" style="opacity:0.6;"><span>Owner &amp; route</span><span>lookup failed</span></div>';
    }
    if (entry.state === 'none') {
      return '<div class="row" style="opacity:0.6;"><span>Owner &amp; route</span><span>not in database</span></div>';
    }
    const ac = entry.data.aircraft;
    const fr = entry.data.flightroute;
    let html = '';
    if (ac && ac.url_photo_thumbnail) {
      html += '<img src="' + ac.url_photo_thumbnail + '" alt="" style="width:100%;border-radius:4px;margin-bottom:10px;display:block;" onerror="this.style.display=\'none\'">';
    }
    if (ac) {
      html += '<div class="row"><span>Registration</span><span>' + (ac.registration || '—') + '</span></div>';
      html += '<div class="row"><span>Type</span><span>' + (ac.type || ac.icao_type || '—') + '</span></div>';
      html += '<div class="row"><span>Owner</span><span>' + (ac.registered_owner || '—') + '</span></div>';
    }
    if (fr) {
      if (fr.airline && fr.airline.name) {
        html += '<div class="row"><span>Airline</span><span>' + fr.airline.name + '</span></div>';
      }
      if (fr.origin && fr.destination) {
        html += '<div class="row"><span>Route</span><span>' + fr.origin.iata_code + ' → ' + fr.destination.iata_code + '</span></div>';
        html += '<div class="row" style="opacity:0.7; font-size:0.75em;"><span>' + fr.origin.municipality + '</span><span>' + fr.destination.municipality + '</span></div>';
      }
    }
    return html || '<div class="row" style="opacity:0.6;"><span>Owner &amp; route</span><span>not in database</span></div>';
  }

  async function fetchNormalizedFlights(c) {
    const sources = [
      { label: 'airplanes.live direct', run: function () { return fetchViaAdsbExchangeCompatible('api.airplanes.live', c, null); } },
      { label: 'airplanes.live via own proxy', run: function () { return fetchViaAdsbExchangeCompatible('api.airplanes.live', c, OWN_PROXY); } },
      { label: 'adsb.lol direct', run: function () { return fetchViaAdsbExchangeCompatible('api.adsb.lol', c, null); } },
      { label: 'adsb.lol via own proxy', run: function () { return fetchViaAdsbExchangeCompatible('api.adsb.lol', c, OWN_PROXY); } },
      { label: 'OpenSky direct', run: function () { return fetchViaOpenSky(c, null); } },
      { label: 'OpenSky via own proxy', run: function () { return fetchViaOpenSky(c, OWN_PROXY); } },
    ];
    const failures = [];
    for (const source of sources) {
      try {
        const raw = await source.run();
        return { raw, sourceLabel: source.label };
      } catch (err) {
        // A 429 only means *this* source is rate limited — it says nothing
        // about the others, so keep going through the remaining sources
        // rather than giving up entirely.
        const reason = (err && err.status === 429) ? 'rate limited (429)' : (err && err.message ? err.message : 'network error');
        failures.push(source.label + ': ' + reason);
      }
    }
    throw new Error('All sources failed — ' + failures.join(' | '));
  }

  async function fetchFlights() {
    if (!center) return;
    setStatus('updating…', 'live');
    try {
      const { raw, sourceLabel } = await fetchNormalizedFlights(center);
      const states = raw.filter(function (f) {
        return !f.onGround && f.lat != null && f.lon != null;
      });
      states.forEach(function (f) {
        f.distanceNm = haversineNm(center.lat, center.lon, f.lat, f.lon);
        f.bearing = bearingDeg(center.lat, center.lon, f.lat, f.lon);
      });
      states.sort(function (a, b) { return a.distanceNm - b.distanceNm; });
      flights = states.filter(function (f) { return f.distanceNm <= RANGE_NM; });
      renderFlights();
      setStatus('live via ' + sourceLabel + ' · ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}), 'live');
    } catch (err) {
      setStatus('connection issue', 'stale');
      flightList.innerHTML = '<li class="error-state">Could not reach flight data. Retrying automatically.' +
        (err && err.message ? '<br><span style="opacity:0.7; font-size:0.75em;">' + err.message + '</span>' : '') + '</li>';
    }
  }

  function fmtAlt(m) {
    if (m == null) return '—';
    return Math.round(m * 3.28084).toLocaleString() + ' ft';
  }
  function fmtSpeed(ms) {
    if (ms == null) return '—';
    return Math.round(ms * 1.94384) + ' kt';
  }
  function vrateArrow(ms) {
    if (ms == null || Math.abs(ms) < 0.5) return { symbol: '→', cls: '' };
    return ms > 0 ? { symbol: '↑', cls: 'vrate-up' } : { symbol: '↓', cls: 'vrate-down' };
  }

  function renderFlights() {
    flightCount.textContent = flights.length + (flights.length === 1 ? ' aircraft' : ' aircraft');
    if (flights.length === 0) {
      flightList.innerHTML = '<li class="empty-state">Nothing broadcasting overhead right now. Quiet skies, or just outside receiver coverage — check back in a bit.</li>';
      drawBlips();
      return;
    }

    // Enrich the nearest aircraft with owner/registration/type — capped so a
    // busy sky doesn't fire off dozens of lookups against a free community
    // API at once. Cached results also cover this for repeat renders.
    flights.slice(0, 15).forEach(function (f) { requestAircraftInfo(f.icao24, f.callsign); });

    flightList.innerHTML = flights.map(function (f) {
      const v = vrateArrow(f.vrateMs);
      const info = aircraftInfoCache.get(f.icao24);
      const ac = (info && info.state === 'ready') ? info.data.aircraft : null;
      const primary = (ac && ac.registration) || f.callsign || f.icao24.toUpperCase();
      const secondary = (ac && ac.registered_owner)
        || ((ac && ac.registration && f.callsign) ? f.callsign : null)
        || (ac && (ac.type || ac.icao_type))
        || f.country || '';
      const isSelected = f.icao24 === selectedIcao;
      let rowHtml = '<li class="flight-row' + (isSelected ? ' selected' : '') + '" data-icao="' + f.icao24 + '">' +
        '<span class="callsign">' + primary + '</span>' +
        '<span class="metric"><span class="val">' + fmtAlt(f.baroAltM) + '</span></span>' +
        '<span class="metric"><span class="val">' + fmtSpeed(f.velocityMs) + '</span></span>' +
        '<span class="metric ' + v.cls + '">' + v.symbol + '</span>' +
        '<span class="metric"><span class="val">' + f.distanceNm.toFixed(1) + ' nm</span></span>' +
        '<span class="country">' + secondary + '</span>' +
        '</li>';
      if (isSelected) {
        rowHtml += '<li class="flight-expansion" data-icao="' + f.icao24 + '">' + expandedDetailHtml(f) + '</li>';
      }
      return rowHtml;
    }).join('');

    Array.prototype.forEach.call(flightList.querySelectorAll('.flight-row'), function (row) {
      row.addEventListener('click', function () {
        selectedIcao = (selectedIcao === row.dataset.icao) ? null : row.dataset.icao;
        renderFlights();
      });
    });

    drawBlips();
  }

  function drawBlips() {
    drawScopeBase();
    const cx = 200, cy = 200, maxR = 180;
    let parts = '';
    flights.forEach(function (f) {
      const r = Math.min(f.distanceNm / RANGE_NM, 1) * maxR;
      const angleRad = toRad(f.bearing - 90); // bearing 0 = up
      const x = cx + r * Math.cos(angleRad);
      const y = cy + r * Math.sin(angleRad);
      const isSelected = f.icao24 === selectedIcao;
      const track = f.trueTrack || 0;
      parts += '<g class="blip' + (isSelected ? ' selected' : '') + '" data-icao="' + f.icao24 + '" transform="translate(' + x + ',' + y + ')">' +
        (isSelected ? '<circle class="blip-halo" r="10"/>' : '') +
        '<path class="tri" d="M0,-6 L4,5 L0,2 L-4,5 Z" transform="rotate(' + track + ')"/>' +
        '<text class="blip-label" x="7" y="4">' + (f.callsign || f.icao24.toUpperCase()) + '</text>' +
        '</g>';
    });
    svg.insertAdjacentHTML('beforeend', parts);
    Array.prototype.forEach.call(svg.querySelectorAll('.blip'), function (g) {
      g.addEventListener('click', function () {
        selectedIcao = (selectedIcao === g.dataset.icao) ? null : g.dataset.icao;
        renderFlights();
      });
    });
  }

  function expandedDetailHtml(f) {
    const v = vrateArrow(f.vrateMs);
    return '<div class="row"><span>Callsign</span><span>' + (f.callsign || '—') + '</span></div>' +
      '<div class="row"><span>ICAO24</span><span>' + f.icao24.toUpperCase() + '</span></div>' +
      '<div class="row"><span>Origin country</span><span>' + (f.country || '—') + '</span></div>' +
      '<div class="row"><span>Altitude</span><span>' + fmtAlt(f.baroAltM) + '</span></div>' +
      '<div class="row"><span>Ground speed</span><span>' + fmtSpeed(f.velocityMs) + '</span></div>' +
      '<div class="row"><span>Heading</span><span>' + (f.trueTrack != null ? Math.round(f.trueTrack) + '°' : '—') + '</span></div>' +
      '<div class="row"><span>Vertical rate</span><span class="' + v.cls + '">' + v.symbol + ' ' + (f.vrateMs != null ? Math.round(f.vrateMs * 196.85) + ' ft/min' : '—') + '</span></div>' +
      '<div class="row"><span>Distance</span><span>' + f.distanceNm.toFixed(1) + ' nm</span></div>' +
      '<div class="detail-divider"></div>' +
      renderAircraftInfoSection(f.icao24);
  }

  // ---------- Boot ----------

  drawScopeBase();

  function fallbackToManualLocation() {
    setLocationLabel('Location unavailable');
    showLocForm();
    setStatus('enter a location to begin', 'stale');
    flightList.innerHTML = '<li class="empty-state">Enter a latitude and longitude above, then tap "Use this location."</li>';
  }

  if (navigator.geolocation) {
    let settled = false;
    // iOS standalone (home-screen) web apps sometimes never resolve the
    // geolocation permission prompt at all — the browser's own `timeout`
    // option can't be trusted to fire in that case, so we back it with our
    // own timer to guarantee the manual location form always appears.
    const safetyTimer = setTimeout(function () {
      if (!settled) { settled = true; fallbackToManualLocation(); }
    }, 8000);

    navigator.geolocation.getCurrentPosition(
      function (pos) {
        if (settled) return;
        settled = true;
        clearTimeout(safetyTimer);
        setCenter(pos.coords.latitude, pos.coords.longitude, 'your location');
      },
      function () {
        if (settled) return;
        settled = true;
        clearTimeout(safetyTimer);
        fallbackToManualLocation();
      },
      { timeout: 8000 }
    );
  } else {
    fallbackToManualLocation();
  }

})();
</script>
</body>
</html>
